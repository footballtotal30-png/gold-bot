name: scan
on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: python Bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Save trade state
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trades.json
          git diff --cached --quiet || (git commit -m "update trades" && git push)
